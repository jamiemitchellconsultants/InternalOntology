name: Ontology graph naming review

on:
  workflow_run:
    workflows: [Ontology graph naming request]
    types: [completed]

permissions: {}

jobs:
  identify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.identify.outputs.all }}
      review: ${{ steps.identify.outputs.review }}
      all_count: ${{ steps.identify.outputs.all_count }}
      review_count: ${{ steps.identify.outputs.review_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: identify
        name: Resolve current PRs and plan graph naming review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONTOLOGY_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}:${{ github.event.workflow_run.run_attempt }}
        run: node scripts/graph-naming-worker.mjs identify

  review:
    needs: identify
    if: needs.identify.result == 'success' && needs.identify.outputs.review_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identify.outputs.review) }}
    concurrency:
      group: ontology-graph-naming-${{ matrix.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    environment:
      name: ontology-semantic-review
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Review changed graph names
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONTOLOGY_PR_NUMBER: ${{ matrix.number }}
          ONTOLOGY_EXPECTED_HEAD: ${{ matrix.headSha }}
          ONTOLOGY_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}:${{ github.event.workflow_run.run_attempt }}
          ONTOLOGY_SEMANTIC_LLM_API_KEY: ${{ secrets.ONTOLOGY_SEMANTIC_LLM_API_KEY }}
          ONTOLOGY_OIDC_TOKEN_URL: ${{ vars.ONTOLOGY_OIDC_TOKEN_URL }}
          ONTOLOGY_OIDC_CLIENT_ID: ${{ vars.ONTOLOGY_OIDC_CLIENT_ID }}
          ONTOLOGY_OIDC_CLIENT_SECRET: ${{ secrets.KEYCLOAK_CLIENT_SECRET }}
          ONTOLOGY_MAX_REQUEST_CHARS: ${{ vars.ONTOLOGY_MAX_REQUEST_CHARS }}
          ONTOLOGY_MODEL_TIMEOUT_MS: ${{ vars.ONTOLOGY_MODEL_TIMEOUT_MS }}
        run: node scripts/graph-naming-worker.mjs review

  finalize:
    needs: [identify, review]
    if: always() && needs.identify.result == 'success' && needs.identify.outputs.all_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identify.outputs.all) }}
    concurrency:
      group: ontology-graph-naming-${{ matrix.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile published result or report unavailable
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONTOLOGY_PR_NUMBER: ${{ matrix.number }}
          ONTOLOGY_EXPECTED_HEAD: ${{ matrix.headSha }}
          ONTOLOGY_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}:${{ github.event.workflow_run.run_attempt }}
        run: node scripts/graph-naming-worker.mjs finalize
