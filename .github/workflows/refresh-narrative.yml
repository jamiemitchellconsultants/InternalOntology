name: Refresh narrative proposals

# Refresh after accepted narrative changes and after maintenance creates a proposal.
on:
  push:
    paths:
      - ".project-narrative.json"
      - "narrative/**"
      - "Narrative.md"
  workflow_run:
    workflows: ["Maintain project narrative"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: refresh-narrative
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: jamiemitchellconsultants/Narrative@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mode: refresh
